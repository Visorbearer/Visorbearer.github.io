name: Daily Birdoku Puzzle

on:
  schedule:
    # Runs at 05:01 UTC daily.
    # This is 12:01 AM EST / 1:01 AM EDT.
    # It generates tomorrow's puzzle so the next puzzle is ready before the date changes.
    - cron: "1 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-birdoku:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Set puzzle date
        run: |
          PUZZLE_DATE=$(TZ=America/New_York date -d 'tomorrow' +'%Y%m%d')
          echo "PUZZLE_DATE=$PUZZLE_DATE" >> "$GITHUB_ENV"
          echo "Target Birdoku puzzle date: $PUZZLE_DATE"

      - name: Check if puzzle already exists
        run: |
          if [ -f "birdoku/puzzles/$PUZZLE_DATE.json" ]; then
            echo "Puzzle for $PUZZLE_DATE already exists. Skipping random generation."
            echo "SKIP_BIRDOKU_GENERATION=true" >> "$GITHUB_ENV"
          else
            echo "No puzzle exists for $PUZZLE_DATE. Generating random puzzle."
            echo "SKIP_BIRDOKU_GENERATION=false" >> "$GITHUB_ENV"
          fi

      - name: Generate puzzle and static files
        if: env.SKIP_BIRDOKU_GENERATION != 'true'
        run: |
          python birdoku/scripts/pick_cats.py --date "$PUZZLE_DATE"
          python birdoku/scripts/build_static.py --date "$PUZZLE_DATE"

      - name: Commit generated Birdoku files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add birdoku/answers/
          git add birdoku/puzzles/
          git add birdoku/data/species_lookup.json

          if git diff --cached --quiet; then
            echo "No generated Birdoku changes to commit"
          else
            git commit -m "Generate Birdoku puzzle for $PUZZLE_DATE"
            git push
          fi
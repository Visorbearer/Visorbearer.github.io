name: Daily Birdoku Puzzle

on:
  schedule:
    # 00:01 EST = 05:01 UTC
    - cron: "1 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-birdoku:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Generate puzzle and static files
        run: |
          python birdoku/scripts/pick_cats.py
          python birdoku/scripts/build_static.py
          python birdoku/scripts/build_species_traits.py

      - name: Commit generated Birdoku files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add birdoku/answers/
          git add birdoku/puzzles/
          git add birdoku/data/species_lookup.json
          git add birdoku/data/species_traits.json

          if git diff --cached --quiet; then
            echo "No generated Birdoku changes to commit"
          else
            git commit -m "Generate daily Birdoku puzzle"
            git push
          fi